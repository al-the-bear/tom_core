name: tom_core_server
description: Server library for the TOM framework.
version: 1.3.0
repository: https://github.com/al-the-bear/tom_core

# Private keys published on purpose, which pub's secret scan would otherwise
# refuse the package for. The development TLS key in
# base_server_configuration.dart is the default a fresh server starts with, and
# usesDevelopmentTlsMaterial exists so a deployment can refuse it. The test
# fixtures are keys generated for the suites and trusted by nothing else: JWT
# signing, mutual TLS (a CA, its clients and a rogue one) and SAML.
false_secrets:
  - /lib/src/tomserver/configuration/base_server_configuration.dart
  - /test/fixtures/jwt/*.pem
  - /test/fixtures/mtls/*.key
  - /test/fixtures/saml/*.pem
  - /test/file_storage_test.dart
  - /test/jwt_signing_test.dart

environment:
  sdk: ^3.10.0

# Add regular dependencies here.
dependencies:
  tom_core_kernel:
    path: ../tom_core_kernel
  tom_basics_console: ^1.0.0
  # The broker-neutral message bus the bus relay (messaging/bus_relay.dart)
  # publishes to.
  tom_core_message_bus:
    path: ../tom_core_message_bus
  tom_reflection: ^1.0.2
  shelf: ^1.4.2
  shelf_router: ^1.1.2
  shelf_multipart: ^2.0.1
  # WebSocket upgrade for the socket endpoint kind
  # (endpoints/web_socket_endpoint.dart). Brings web_socket_channel, which is
  # the channel type a socket handler talks to.
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.0
  mysql_client: ^0.0.27
  yaml: ^3.1.4
  # Used directly by the audit trail's hash chain (audit/audit_sink.dart);
  # declared explicitly rather than relied on as a transitive dependency.
  crypto: ^3.0.0
  # StreamQueue drives the SMTP line protocol (messaging/smtp_transport.dart);
  # declared explicitly for the same reason as crypto above.
  async: ^2.11.0
  # The AES-GCM cipher of field-level encryption
  # (object_persistence/field_encryption.dart), and the generated reflection
  # output, which imports `pointycastle/asymmetric/api.dart` directly to name
  # RSAPrivateKey and RSAPublicKey; tom_crypto re-exports both key types, so
  # hand-written code reaches them through the kernel barrel. Major 4, the
  # major tom_crypto 1.4.0 is built on: one pointycastle in the graph.
  pointycastle: ^4.0.0
  # Needed by the generated reflection output, and by
  # authentication/jwt_signing.dart, which imports it under a prefix. The names
  # this package's own code uses — SecretKey, JWT — are re-exported by
  # tom_crypto 1.2.0, so the unprefixed imports that once needed this are gone.
  dart_jsonwebtoken: ^3.1.1
  # PDF generation for the export renderers (export/pdf_renderer.dart).
  # Apache-2.0; see doc/export.md for why this one and not a hand-written
  # encoder. The caret range spans 3.12.x (SDK >=2.19) and 3.13.x (SDK >=3.12)
  # so a machine on an older SDK still resolves.
  pdf: ^3.12.0
  # HTTP/2 client for push delivery (messaging/push_transport.dart). APNs
  # answers nothing else, and dart:io's HttpClient speaks only HTTP/1.1.
  # BSD-3, from the Dart team. 2.x because 3.x needs a newer SDK floor.
  http2: ^2.3.1

  http: ^1.6.0
  uuid: ^4.6.0
  path: ^1.9.1
  xml: ^7.0.1
  # The OpenTelemetry SDK behind the tracing module (tracing/): span
  # processing, sampling and the OTLP/HTTP span exporter. Only that module
  # imports it; the framework's spans go through the kernel's TomTracing seam,
  # so the SDK can be replaced there alone.
  opentelemetry: ^0.18.11
  postgres: ^3.5.20
  meta: ^1.18.0
dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
  build: ^4.0.3
  build_runner: ^2.10.4
  # Hosted, lower bound only: pub takes the analyzer-10 line (1.8.x) while
  # flutter or tom_d4rt hold analyzer below 14, and 1.9+ once they move.
  tom_reflection_generator: ">=1.8.2"
  tom_build:
    path: ../../devops/tom_build
  jose: ^0.3.5+2

name: tom_core_server
description: Server library for the TOM framework.
version: 1.1.4
publish_to: none

environment:
  sdk: ^3.10.0

# Add regular dependencies here.
dependencies:
  tom_core_kernel:
    path: ../tom_core_kernel
  tom_basics_console: ">=1.0.0"
  tom_reflection: ">=1.0.1"
  shelf: ^1.4.2
  shelf_router: ^1.1.2
  shelf_multipart:
  mysql_client:
  yaml:
  # Used directly by the audit trail's hash chain (audit/audit_sink.dart);
  # declared explicitly rather than relied on as a transitive dependency.
  crypto: ^3.0.0
  # StreamQueue drives the SMTP line protocol (messaging/smtp_transport.dart);
  # declared explicitly for the same reason as crypto above.
  async: ^2.11.0
  # RSAPrivateKey/RSAPublicKey for signing audit anchors
  # (audit/audit_anchor.dart). tom_crypto supplies rsaSign/rsaVerify but not the
  # key types, which stay pointycastle's; declared explicitly rather than
  # inherited through tom_crypto's own dependency.
  pointycastle: ^3.9.1
  # PDF generation for the export renderers (export/pdf_renderer.dart).
  # Apache-2.0; see doc/export.md for why this one and not a hand-written
  # encoder. The caret range spans 3.12.x (SDK >=2.19) and 3.13.x (SDK >=3.12)
  # so a machine on an older SDK still resolves.
  pdf: ^3.12.0

  http: any
  uuid: any
  path: any
dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
  build: ^4.0.3
  build_runner: ^2.10.4
  tom_reflection_generator:
    path: ../../reflection/tom_reflection_generator
  tom_build:
    path: ../../devops/tom_build

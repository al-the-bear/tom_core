# What has been asked, and of which tests.
#
# One entry per behaviour this package promises: a fallback, a precedence rule,
# a guard, an error path. `find` is the smallest edit that removes the promise
# and `tests` are the files expected to notice. Run with
# `python3 tool/mutation_sweep.py`; a surviving mutation is a behaviour the
# suite names without pinning.
#
# A module absent from this file has not been swept. That is the reason the
# catalogue is committed and not the script alone.
#
# `find` must match its file exactly once, so an entry cannot silently drift
# onto a different line.
#
# Two entries have to be written carefully, and both were got wrong first:
#
#  * An **equivalent mutant** survives for no fault of the suite -- rewriting
#    `rows.isEmpty ? null : rows.first` as `rows.firstOrNull` is the same
#    function, so its survival says nothing about coverage and only trains a
#    reader to ignore the report. One such entry was written and removed.
#  * A behaviour covered only by a `db`-tagged suite carries `requires: db`.
#    Those suites self-skip without a MariaDB on 127.0.0.1:3309, and a skipped
#    suite passes -- so without the marker every one of them reports as
#    surviving on a machine with no database, which is a false alarm about the
#    one thing this tool exists to report truthfully.

cache:
  - behaviour: a read promotes the entry to most-recently-used
    file: lib/src/tomserver/cache/server_cache.dart
    find: "        if (_first != entry) {"
    replace: "        if (false) {"
    tests: test/cache_test.dart
  - behaviour: promoting the tail makes its predecessor the new tail
    file: lib/src/tomserver/cache/server_cache.dart
    find: "            // The promoted entry was the tail; the new tail is its predecessor.\n            _last = oldBefore;"
    replace: "            // The promoted entry was the tail; the new tail is its predecessor."
    tests: test/cache_test.dart
  - behaviour: an entry past its deletion time is a miss, not a hit
    file: lib/src/tomserver/cache/server_cache.dart
    find: "        if (entry.deletionTime != null &&\n            !entry.deletionTime!.isAfter(DateTime.now())) {"
    replace: "        if (false) {"
    tests: test/cache_test.dart
  - behaviour: an entry with no deletion time never expires
    file: lib/src/tomserver/cache/server_cache.dart
    find: "        if (entry.deletionTime != null &&\n            !entry.deletionTime!.isAfter(DateTime.now())) {\n          cache.removeEntry(key);"
    replace: "        if (!(entry.deletionTime?.isAfter(DateTime.now()) ?? false)) {\n          cache.removeEntry(key);"
    tests: test/cache_test.dart
  - behaviour: an expired entry is dropped from the cache, not merely reported absent
    file: lib/src/tomserver/cache/server_cache.dart
    find: "          cache.removeEntry(key);\n          return null;"
    replace: "          return null;"
    tests: test/cache_test.dart


# The OpenTelemetry Collector configuration tool/run_otel_tests.sh starts:
# receive OTLP over HTTP, write every metrics export and every trace export to
# a file of its own, which the tests read.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  file/metrics:
    path: /out/metrics.json
  file/traces:
    path: /out/traces.json

service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [file/metrics]
    traces:
      receivers: [otlp]
      exporters: [file/traces]

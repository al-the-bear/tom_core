# Default test configuration for tom_core_server.
#
# Run suite files one at a time. `configuration_test.dart` and
# `runtime_environment_test.dart` set `Directory.current` to a scratch
# directory, because the configuration and runtime-environment code reads
# `.env` and its siblings relative to the working directory — and the working
# directory belongs to the whole process, while `dart test` runs concurrent suite
# files as isolates of one process. A suite running beside them then resolves
# every relative path (`lib/…`, `test/fixtures/…`) against the scratch directory
# and fails on a file that exists. The DB-backed suites are not the reason: each
# provisions a database of its own (test/fixtures/test_database.dart).
concurrency: 1

tags:
  # DB-backed surfaces (datasources, object-persistence CRUD, db_migration).
  # These require a reachable MariaDB and are self-skipping when none is found,
  # so the default run stays green everywhere. Select them explicitly with
  # `--tags db` (after `docker compose -f docker-compose.test.yaml up -d`).
  db:
    # A DB round-trip (connect + schema setup + CRUD) is slower than the
    # in-memory suites; give it headroom over the default 30s.
    timeout: 2x
  # Single sign-on interoperability against Keycloak (sso_keycloak_test.dart).
  # Self-skipping when no Keycloak is listening on 127.0.0.1:8089; run with
  # `tool/run_sso_tests.sh`, which starts one from docker-compose.sso.yaml.
  sso:
    timeout: 2x

targets:
  $default:
    builders:
      tom_reflection_generator:reflection_generator:
        generate_for:
          # The test reflection root: the generator follows its import graph to
          # capture the fixture service interface + implementation, the config
          # object, and (transitively, via the tom_core_server barrel) the
          # reflected server surface the endpoint pipeline mirrors over. Emits
          # test/fixtures/reflection_fixture.reflection.dart, whose
          # initializeReflection() the test suite calls in setUpAll.
          - test/fixtures/reflection_fixture.dart
          # The example suite's reflection root. It needs its own, separate from
          # the test fixture's, because an example is not a test and cannot
          # reach into test/ — the cluster demonstration in particular runs as
          # standalone processes under
          # example/scheduling/cluster/run_cluster_demo.sh. One root serves
          # every example that needs reflection (the cluster demo's row type,
          # the endpoints example's file-slot entity): each root reaches the
          # package barrel and so costs a further ~1.7 MB of generated source
          # capturing the same framework surface. Emits
          # example/example_reflection.reflection.dart.
          - example/example_reflection.dart
        options:
          formatted: true

# Build configuration for tom_core_kernel
#
# Reflection generator configuration for runtime reflection.

targets:
  $default:
    builders:
      # Reflection generator for test files
      tom_reflection_generator:reflection_generator:
        generate_for:
          - test/beanlocator_test.dart
          # Interface selection lives in three separate reflection domains:
          # discovery walks every annotated class in a domain and aborts the
          # whole pass on the first unresolvable interface, so the deliberately
          # ambiguous and the deliberately excluded fixtures cannot share a
          # domain with the resolvable ones.
          - test/beanlocator_selection_test.dart
          - test/beanlocator_ambiguous_selection_test.dart
          - test/beanlocator_excluded_selection_test.dart
          - test/crypto_test.dart
          - test/http_connection_test.dart
          - test/little_things_test.dart
          - test/observable_test.dart
          - test/preferences_test.dart
          - test/reflection_test.dart
          - test/resources_test.dart
          - test/scheduled_job_test.dart
          - test/security_test.dart
          - test/settings_test.dart
          - test/shutdown_cleanup_test.dart
          # Example entry point. `example/samples/` is a single reflection
          # domain: every module runner imports the seed this entry point
          # generates, so one generated file covers the whole sample tree.
          - example/run_all_samples.dart
        options:
          formatted: true

name: tom_core_kernel
description: Core kernel library for the TOM framework containing base modules.
version: 1.1.16
repository: https://github.com/al-the-bear/tom_core

environment:
  sdk: ^3.10.0

# Add regular dependencies here.
dependencies:
  tom_reflection: ^1.0.2
  # Floor 1.0.3: setCurrentEnvironment now applies its fallback unconditionally
  # — earlier it kept an already-set environment when the requested name
  # was absent, so the runtime fallback sample never switched. 1.0.2 added
  # TomRuntime.reset() (clears the process-global environment/platform registries
  # so the runtime samples isolate themselves in the single-process master
  # runner). 1.0.1 was the TomLogger push/pop log-level stack fix.
  # Floor 3.1.0 added TomBaseException.renderStackTrace, the seam TomException
  # overrides so one renderer produces both the `stackTrace` string the base
  # constructor stores and the trace `printStackTrace` logs. Before it the two
  # were formatted by different algorithms with different fold sets.
  # Floor 3.1.1: TomLogOutput.output declares `origin` optional, matching its
  # own documentation. Required, it compiled both ways — an override may widen
  # a required positional — so this module implemented both spellings.
  tom_basics: ^3.3.0
  # Floor 1.1.0: earlier versions drew secure random bytes with an exclusive
  # bound of 255, so no byte could be 0xFF — a bias inherited by every RSA key
  # pair and every password salt, both of which this package re-exports.
  tom_crypto: ^1.3.0
  # HMAC-SHA1 for the RFC 4226 / 6238 one-time-password primitives (TomTotp),
  # which both tiers need: the server to verify a code, an enrolment tool or an
  # authenticator to produce one.
  crypto: ^3.0.0
  # `@nonVirtual` on the access-control evaluation entry points. The annotation
  # is load-bearing rather than decorative: it is what stops a subclass from
  # overriding the method every consumer calls and thereby skipping the
  # deployment cap (the min(user, server) meet).
  meta: ^1.9.0
  stack_trace: ^1.12.2
  http: ^1.6.0
  typed_data: ^1.4.0
  yaml: ^3.1.4
  timezone: ^0.11.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
  # `TomStandalonePlatformUtils`, which the samples' preamble installs so every
  # framework log line carries an isolate identity instead of a bare "-". Named
  # here rather than reached through the `tom_core_server` dev-dependency below:
  # the samples need one class, not a server framework. A *dev* dependency on
  # purpose — this package is platform-neutral, and the point of
  # `TomPlatformUtils` is that the library never reaches for `dart:io` itself.
  # Only the samples, which are console programs, may.
  tom_basics_console: ">=1.0.0"
  build_runner: ^2.10.4
  build: ^4.0.3
  tom_build:
    path: ../../devops/tom_build
  # Floor 1.3.1: type-literal annotation arguments (e.g. `@TomComponent(EmailService)`)
  # are emitted import-prefixed; earlier versions dropped the prefix and produced
  # an undefined-name reference that broke the samples runner.
  tom_reflection_generator: ">=1.4.0"
  tom_core_server:
    path: ../tom_core_server
  mysql_client: any
  shelf: any

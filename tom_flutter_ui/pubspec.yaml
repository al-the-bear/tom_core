name: tom_flutter_ui
description: >-
  The Flutter widget library of the Tom Framework: authorization-aware,
  resource-bound, observable widgets, a declarative form system, the Tom
  Action system, and a fluent row-based layout engine over tom_core_kernel.
version: 1.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  tom_core_kernel:
    path: ../tom_core_kernel
  # Cupertino icon font — declared here so any consumer of
  # `tom_flutter_ui`'s Cupertino field widgets pulls the font in
  # transitively (the CupertinoIcons.ttf is what every CupertinoIcons.*
  # IconData binds to). Without it, icons render as placeholder
  # rectangles.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Reflection for the test tree only. `TomForm` is a `TomClass`, whose member
  # discovery goes through kernel reflection, so the `forms/list/` tests need a
  # generated mirror for their fixtures — see `build.yaml`.
  build_runner: ^2.10.4
  build: ^4.0.3
  tom_reflection_generator: ">=1.3.1"
  # `widget_base_layering_test.dart` walks the import graph of `lib/src/` as
  # files on disk, so it resolves relative import targets against the importing
  # file's directory itself. Test-tree only; nothing in `lib/` uses it.
  path: ^1.9.0

# No `flutter:` section: this library ships no assets, no fonts, and leaves
# `uses-material-design` to the consuming application.

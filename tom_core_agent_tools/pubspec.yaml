name: tom_core_agent_tools
description: >-
  A tool surface for LLM agents: tools with JSON-schema arguments validated
  before they run, a closed registry presented to a model as native tool
  declarations or through an in-process MCP server, a permission scope with a
  fixed gate order, an invocation record that carries execution consent, an
  append-only audit trail of every call, and preview-then-apply runs that keep
  or discard an agent's work as one unit.
version: 0.1.0
publish_to: none
repository: https://github.com/al-the-bear/tom_ai_core

environment:
  sdk: ^3.10.8

dependencies:
  meta: ^1.15.0
  # The provider contract a binding implements (LlmToolBinding).
  tom_llm:
    path: ../../basics/tom_llm

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

# Build configuration for tom_core_flutter
#
# Reflection generator configuration for the files that need a generated
# *.reflection.dart companion:
#
#   - preferences_test   round-trips a reflected preference value and resolves
#                        the platform-annotated @TomComponent implementations
#                        of TomDevicePreferences through the bean locator.
#   - example/reflection_seed
#                        the one entry point every example shares. An example
#                        that makes a real HTTP call encodes framework DTOs
#                        through reflection, so it must initialise it first;
#                        generating for the seed rather than for each example
#                        keeps that multi-megabyte companion paid for once.
#
# The generator is restricted to those files; without `generate_for` it would
# attempt to generate for every Dart file in the package.

targets:
  $default:
    builders:
      tom_reflection_generator:reflection_generator:
        generate_for:
          - test/preferences_test.dart
          - example/reflection_seed.dart
        options:
          formatted: true

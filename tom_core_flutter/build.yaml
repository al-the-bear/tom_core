# Build configuration for tom_core_flutter
#
# Reflection generator configuration for the security module test, which
# verifies that @TomClient2FAAdaptor is reflection-discoverable. The generator
# is restricted to the test files that need a generated *.reflection.dart
# companion; without `generate_for` it would attempt to generate for every
# Dart file in the package.

targets:
  $default:
    builders:
      tom_reflection_generator:reflection_generator:
        generate_for:
          - test/security_test.dart
        options:
          formatted: true

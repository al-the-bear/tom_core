name: tom_core_flutter
description: Flutter integration layer for the TOM framework — re-exports tom_core_kernel and adds Flutter widgets and client utilities.
version: 1.2.1
publish_to: none

environment:
  # Raised to match tom_flutter_ui, which this package now depends on for the
  # widgets its second-factor panels are built from.
  sdk: ^3.11.0

# Add regular dependencies here.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  fetch_client: ^1.0.2
  timezone_to_country:
  web: ^1.1.1
  tom_reflection: ">=1.0.1"
  tom_core_kernel:
    path: ../tom_core_kernel
  # The widget library the framework-owned second-factor panels render with, so
  # an application gets the same look and the same resource/authorization
  # plumbing here as it does everywhere else. A sibling of this package over the
  # kernel (tom_flutter_ui does not depend on tom_core_flutter), so the edge
  # adds no cycle — and every existing consumer already depends on it.
  tom_flutter_ui:
    path: ../tom_flutter_ui
  # Pure-Dart QR *encoding* for the TOTP enrolment panel. Deliberately the
  # encoder only and not a rendering package: the modules are painted by a
  # CustomPainter here, so the widget inherits this framework's theming rather
  # than a third party's.
  qr: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.6
  build_runner: ^2.10.4
  build: ^4.0.3
  tom_reflection_generator: ">=1.2.1"

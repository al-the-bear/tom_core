name: tom_core_flutter
description: Flutter integration layer for the TOM framework — re-exports tom_core_kernel and adds Flutter widgets and client utilities.
version: 1.2.1
repository: https://github.com/al-the-bear/tom_core

environment:
  # Raised to match tom_flutter_ui, which this package now depends on for the
  # widgets its second-factor panels are built from.
  sdk: ^3.11.0

# Add regular dependencies here.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  fetch_client: ^1.0.2
  timezone_to_country: ^3.2.0
  web: ^1.1.1
  tom_reflection: ^1.0.2
  tom_core_kernel:
    path: ../tom_core_kernel
  # The widget library the framework-owned second-factor panels render with, so
  # an application gets the same look and the same resource/authorization
  # plumbing here as it does everywhere else. A sibling of this package over the
  # kernel (tom_flutter_ui does not depend on tom_core_flutter), so the edge
  # adds no cycle — and every existing consumer already depends on it.
  tom_flutter_ui:
    path: ../tom_flutter_ui
  # Pure-Dart QR *encoding* for the TOTP enrolment panel. Deliberately the
  # encoder only and not a rendering package: the modules are painted by a
  # CustomPainter here, so the widget inherits this framework's theming rather
  # than a third party's.
  qr: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.6
  # Test-only: the preferences client is exercised against a scripted
  # `http.Client` instead of a socket, and a fake has to name the type it stands
  # in for. The library code reaches HTTP through the kernel's channel
  # abstraction and never imports this.
  http: ^1.5.0
  # Test-only: the documentation-link guard resolves relative markdown targets
  # against the file that declares them, which is path joining and
  # normalisation, not string concatenation.
  path: ^1.9.0
  build_runner: ^2.10.4
  build: ^4.0.3
  # 1.3.1 is the floor: earlier versions emit a bare type name for a
  # `TypeLiteral` annotation argument (`@TomComponent(TomDevicePreferences)`),
  # which is an undefined name in the generated library and fails to compile.
  tom_reflection_generator: ">=1.4.0"

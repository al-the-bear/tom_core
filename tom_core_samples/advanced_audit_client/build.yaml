# Reflection generator config. Seed the generator from one entry point
# (lib/reflection_seed.dart) so the reflected graph is exactly what the admin
# console binds: the advanced_todo_contracts DTOs and the TomForm subclasses
# over them. The seed lists what lib/domain/ declares and lib/forms/ binds.
# Emits lib/reflection_seed.reflection.dart.
targets:
  $default:
    builders:
      tom_reflection_generator:reflection_generator:
        generate_for:
          - lib/reflection_seed.dart
        options:
          formatted: true

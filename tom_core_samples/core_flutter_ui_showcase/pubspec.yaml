name: core_flutter_ui_showcase
description: >-
  Tom Core sample — a code-beside-widget showcase of the tom_flutter_ui widget
  kit. Every cell renders a live widget next to the verbatim Dart that produced
  it, grouped by component family.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # The Tom Flutter UI widget kit this sample showcases, plus the kernel it
  # builds on (observable state, the four-state authorization model).
  tom_flutter_ui:
    path: ../../tom_flutter_ui
  tom_core_kernel:
    path: ../../tom_core_kernel

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/showcase_resources.json

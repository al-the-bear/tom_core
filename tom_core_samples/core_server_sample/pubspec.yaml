name: core_server_sample
description: >-
  Tom Core sample backend — a todo-management API on tom_core_server. Persists
  the shared todo_domain model, authenticates users, and grades field access
  with the four-state authorization schema. The persistence + authorization
  core is analyze-clean and unit-tested without a database; the live boot runs
  against the bundled Docker MariaDB.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  tom_core_server:
    path: ../../tom_core_server
  tom_core_kernel:
    path: ../../tom_core_kernel
  todo_domain:
    path: ../todo_domain
  tom_reflection: ">=1.0.1"

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
  build: ^4.0.3
  build_runner: ^2.10.4
  tom_reflection_generator:
    path: ../../../reflection/tom_reflection_generator

name: advanced_auth_server
description: >-
  Auth server for the advanced Tom Core full-stack sample — a JWT issuer plus a
  role-gated admin API on tom_core_server. Authenticates users against auth_db,
  mints the bearer-token pair both clients present, and exposes /admin/* CRUD for
  users/roles/groups and the (role, resourceKey)→TomAuthState grant matrix.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  tom_core_server:
    path: ../../tom_core_server
  tom_core_kernel:
    path: ../../tom_core_kernel
  advanced_todo_contracts:
    path: ../advanced_todo_contracts
  advanced_todo_domain:
    path: ../advanced_todo_domain
  tom_reflection: ">=1.0.1"
  # Endpoint error handlers return shelf Responses (the 401 login mapping), so
  # shelf is a direct dependency, not merely transitive via tom_core_server.
  shelf: ^1.4.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
  build: ^4.0.3
  build_runner: ^2.10.4
  tom_reflection_generator:
    path: ../../../reflection/tom_reflection_generator
  # Writes openapi/openapi.json from the endpoint annotations (tool/openapi.dart).
  tom_core_openapi:
    path: ../../../core_extension/tom_core_openapi

# Bundled MariaDB for the advanced sample's auth server. The migration tree is
# mounted into the stock initdb hook for the first-boot bootstrap, and read again
# at runtime by TomDbMigrations.migrateDatabases() for incremental migrations —
# one SQL tree, two consumers (the tom_uam_server / core_server_sample pattern).
#
# The default published port is 3307 (not 3306) so this auth_db and the app
# server's app_db can run side by side on one host without colliding.
#
#   cp .env.example .env
#   docker compose up -d auth-db
#   dart run bin/auth_server_start.dart
services:
  auth-db:
    image: ${AUTH_DB_DOCKER_IMAGE:-mariadb:11}
    container_name: advanced-auth-db
    ports:
      - "${AUTH_DB_PORT:-3307}:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
      - ./database_migrations/auth_db/auth_schema:/docker-entrypoint-initdb.d:ro
    environment:
      MARIADB_DATABASE: "${AUTH_DB_NAME:-auth_db}"
      MARIADB_ROOT_PASSWORD: "${AUTH_DB_ROOT_PASSWORD:-password}"
      MARIADB_USER: "${AUTH_DB_USER:-auth}"
      MARIADB_PASSWORD: "${AUTH_DB_PASSWORD:-auth}"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  auth_db_data:

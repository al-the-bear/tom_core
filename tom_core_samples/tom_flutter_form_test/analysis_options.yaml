include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated reflection file — managed by the reflection generator; do not edit by hand.
    # hides: 0 errors (measured 2026-09-18) — one generated reflection seed,
    #   rewritten by the reflection generator on every build. The entry keeps a
    #   machine-written file out of the LINT surface; nothing hand-written is
    #   behind it.
    - lib/main.reflection.dart
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

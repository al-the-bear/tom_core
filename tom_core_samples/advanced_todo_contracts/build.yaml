# Reflection generator config. The DTOs and @tomService endpoint interfaces are
# reflected from one entry point (lib/src/reflection_entry.dart); the contracts
# + their reflection seed are populated in steps 4–5 of the implementation plan.
# Emits lib/src/reflection_entry.reflection.dart.
targets:
  $default:
    builders:
      tom_reflection_generator:reflection_generator:
        generate_for:
          - lib/src/reflection_entry.dart
        options:
          formatted: true

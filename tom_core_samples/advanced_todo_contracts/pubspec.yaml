name: advanced_todo_contracts
description: >-
  Shared wire contracts for the advanced Tom Core full-stack sample — the typed
  service interfaces (AuthApiService, AdminApiService, AppApiService), the
  kernel TomApi wire registry, and the reflection-first JSON DTOs (login,
  graded-field, share, grant-matrix, admin CRUD, file descriptor, resource
  bundle) the servers implement and the clients call.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  tom_core_kernel:
    path: ../../tom_core_kernel
  advanced_todo_domain:
    path: ../advanced_todo_domain
  tom_reflection: ">=1.0.1"

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
  build: ^4.0.3
  build_runner: ^2.10.4
  tom_reflection_generator:
    path: ../../../reflection/tom_reflection_generator

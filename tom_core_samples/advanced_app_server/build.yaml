# Reflection generator config. The live-boot entrypoint (bin/app_server_start.dart)
# is the reflection root: the generator follows its import graph to capture the
# config class, the AppApiService implementation, the persistence records, and
# (via the tom_core_server barrel) the MariaDB driver, migration adaptor, and
# TomResourceGrant. The boot + reflected graph are wired in steps 14–21. Emits
# bin/app_server_start.reflection.dart.
targets:
  $default:
    builders:
      tom_reflection_generator:reflection_generator:
        generate_for:
          - bin/app_server_start.dart
        options:
          formatted: true

# The ops server: the back-office scheduler (retention purge, digest, weekly
# export, audit anchors) over app_db. It serves no HTTP, so it has no Service
# and no HTTP probes; the kubelet restarts it when the process exits. Its jobs
# run under database leases, so a second replica would take turns rather than
# run them twice — one is enough.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-server
  labels: {app.kubernetes.io/name: ops-server, app.kubernetes.io/part-of: advanced-todo}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ops-server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ops-server, app.kubernetes.io/part-of: advanced-todo}
    spec:
      # SIGTERM closes the runtime: the run in flight finishes and the audit
      # trail is flushed before the process exits.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: server
          image: advanced-ops-server:latest
          envFrom:
            - configMapRef: {name: advanced-config}
          env:
            - name: APP_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: advanced-db-credentials, key: app-password}}
            - name: AUTH_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: advanced-db-credentials, key: auth-password}}
            # Without OPS_SMTP_HOST the digest is written as .eml files here
            # instead of being sent; set the OPS_SMTP_* variables to send it.
            - {name: OPS_MAIL_DIR, value: /app/data/mail}
            # The audit anchors belong in a store the server cannot rewrite;
            # mount one here and set OPS_ANCHOR_INDEPENDENT=true.
            - {name: OPS_ANCHOR_DIR, value: /app/data/anchors}
            - name: OPS_NODE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}

# The ops server's user-facing text, English.
#
# Everything a recipient reads lives here rather than in Dart. `text` is the
# whole body. The sentences it assembles from are separate keys that the digest
# resolves on its own and passes in finished:
#
# - A sentence that states a count comes in two forms, `one` and `other`, and
#   the digest picks the one the count takes. A template substitutes a count
#   but cannot choose "item" or "items" by it.
# - A sentence that only holds sometimes (`overdue_line`, `next_due_line`) is
#   passed in as an empty string when its condition does not hold.
email:
  ops_digest:
    subject: "{product}: {openSummary}"
    text: |
      Good morning {displayName},

      {openLine}
      {overdueLine}{nextDueLine}
      — {product}, sent by {sender}
    open_summary:
      one: "{openCount} open item"
      other: "{openCount} open items"
    open_line:
      one: "You have {openCount} open item."
      other: "You have {openCount} open items."
    overdue_line:
      one: |
        {overdueCount} of them is past its due date.
      other: |
        {overdueCount} of them are past their due date.
    next_due_line: |
      The next one falls due on {nextDue}.

# The audit report a saved question delivers (the framework's audit_reports
# module): the export is attached or linked, this is the mail around it.
audit_reports:
  delivery:
    subject: "Audit report: {name}"
    text: |
      The audit report "{name}" is attached: {count} record(s).

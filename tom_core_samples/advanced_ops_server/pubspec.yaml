name: advanced_ops_server
description: >-
  Back-office server for the advanced Tom Core full-stack sample — no UI and no
  endpoints, only scheduled work over the app server's existing database. Runs a
  retention purge through the repository audit chokepoint, a per-user digest
  through the messaging outbox, a scheduled export into the blob store, and an
  audit anchor publisher on its own timer, all under a deliberately narrow
  server principal.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  tom_core_server:
    path: ../../tom_core_server
  tom_core_kernel:
    path: ../../tom_core_kernel
  # The whole point of this server is that it operates on the *app server's*
  # data through the *app server's* repositories. Re-declaring ItemRecord here
  # would give the sample two entity models over one table, and the audit
  # chokepoint claim — that a delete through the repository lands in the trail —
  # would then be a claim about a copy nobody runs.
  advanced_app_server:
    path: ../advanced_app_server
  # For the same reason, and one more: the digest needs the *addresses*, which
  # live in auth_db behind `UserRepository`. Reaching them through the auth
  # server's own repository keeps the ops server from owning a second view of
  # `auth_users` whose column set would drift the first time a field moved.
  advanced_auth_server:
    path: ../advanced_auth_server
  advanced_todo_domain:
    path: ../advanced_todo_domain
  tom_reflection: ">=1.0.1"

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
  build: ^4.0.3
  build_runner: ^2.10.4
  tom_reflection_generator:
    path: ../../../reflection/tom_reflection_generator

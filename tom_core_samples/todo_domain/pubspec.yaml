name: todo_domain
description: >-
  Shared, reflected todo-management domain model for the Tom Core samples —
  the single source of truth (User, Project, TodoList, TodoItem, priority/label
  enums) depended on by both the server and the client samples.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  tom_core_kernel:
    path: ../../tom_core_kernel
  tom_reflection: ">=1.0.1"

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
  build: ^4.0.3
  build_runner: ^2.10.4
  tom_reflection_generator:
    path: ../../../reflection/tom_reflection_generator

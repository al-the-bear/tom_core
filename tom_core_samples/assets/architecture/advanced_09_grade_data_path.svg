<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 672" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">
  <!--
    The grant rows -> resource-role map -> per-field grade -> field data path:
    the grade a field renders at, traced from a database row to a widget (RCC2).
      1. auth_db.tom_resource_grant rows (role_name, resource_key, access_level)
         plus the principal's share delegations
      2. AppReadService.resourceRoles(userId): fold ownership grants + shares and
         expand each down its containment subtree -> flat resourceKey -> roleName map
      3. GET /resource-roles -> Map<String,String>  (resourceKey -> roleName)
         (the app client fetches this ONCE at login; per-field grades never cross
          the wire on a read anymore)
      4. AppSession installs AppResourceRoleAdapter(resourceRoles) as the global
         TomAuthorization adapter -> TomResourceRoleRegistry  [app_session.dart,
         app_resource_role_adapter.dart]
      5. item screen resolves the item's resource ceiling through the registry and
         narrows it by the shared per-role field grade:
         itemKey = ResourceRoleKeys.item(id)   // shared-domain builder
         resourceState = TomAuthorization.resolveAuth(itemKey)
         field.authorizer = TomAuthorizer.fixed(
             resourceState.narrow(projectRoleFieldGrades[role][basePath] ?? none))
         [advanced_app_client/lib/screens/item_detail_screen.dart _resolveForm()]
      6. TomField.resolveEffectiveAuth() layer 4, the per-widget authorizer
         [tom_flutter_ui/lib/src/forms/tom_form.dart resolveEffectiveAuth()]
         (authorizer.effectiveAuth(state))
      7. TomAuthState -> the field renders at its grade.
    CITATIONS HERE NAME A SYMBOL, NEVER A LINE NUMBER, and that is a rule rather
    than a preference. A figure is the worst possible host for a line citation:
    nothing compiles it, so an edit to the cited file moves the target with
    nothing in the editing session pointing back here, and the stale number goes
    on reading as authoritative. Every line range sits inside something with a
    name, and the named form survives the edit — so name it.
    tool/check_source_citations.py enforces this for figures as well as for Dart.
    TWO KEY SPACES meet at step 5, and they are not one namespace:
      item:<id>          addresses the RESOURCE — picks the principal's role
                         (resourceRoles[itemKey]). Only ResourceRoleKeys writes
                         this format; never hand-interpolate it.
      todo.item.<field>  addresses the GRADED FIELD — a TomField basePath,
                         picking the grade within that role's row
                         (grades[basePath]).
    Putting the dotted scope in front of the resource type — writing `todo.`
    immediately before `item:` and the id — merges the two, and the merge fails
    silently: the installed adapter gates any key containing ':'
    [app_resource_role_adapter.dart], so the merged key resolves as a resource
    key, matches no grant, and collapses the field to none. Closed-safe and
    wrong, with nothing said. That is why this figure names both spaces: it is
    the one place the path from a grant row to a rendered field crosses them
    both. tool/check_resource_key_namespace.py gates the merged form tree-wide.
    The server re-resolves the same grade on WRITE (FieldGradeResolver in
    AppWriteService) and rejects a changed field graded below full — the client
    grade is a UX convenience, the server write-check is the guarantee.
  -->
  <defs>
    <marker id="arrow9" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#37474f"/>
    </marker>
  </defs>
  <style>
    .box{stroke:#37474f;stroke-width:1.5;}
    .db{fill:#eceff1;}
    .server{fill:#e8f5e9;}
    .wire{fill:#fff3e0;}
    .client{fill:#e3f2fd;}
    .render{fill:#f3e5f5;}
    .lbl{fill:#212121;}
    .mono{fill:#37474f;font-family:monospace;font-size:11px;}
    .flow{stroke:#37474f;stroke-width:1.5;fill:none;marker-end:url(#arrow9);}
    .cite{fill:#90a4ae;font-size:10.5px;font-family:monospace;}
    .side{fill:#546e7a;font-size:10.5px;}
  </style>

  <!-- Each arrow gap carries two stacked lines, both starting at x=390: what
       happens on the step, then where it lives. They were a single line once,
       with the citation right-anchored at x=630, and at these text lengths the
       two simply overprinted each other — the citations were unreadable in the
       rendered figure whatever they said. Stacking is what makes room for a
       symbol reference, which is longer than the line number it replaces. -->

  <rect class="box db" x="120" y="20" width="520" height="42" rx="7"/>
  <text class="mono" x="380" y="46" text-anchor="middle">auth_db.tom_resource_grant rows + the principal's share delegations</text>

  <path class="flow" d="M380,62 L380,108"/>
  <text class="side" x="390" y="80">fold ownership grants + shares into effective roles</text>
  <text class="cite" x="390" y="95">resource_role_resolver.dart</text>

  <rect class="box server" x="120" y="108" width="520" height="42" rx="7"/>
  <text class="mono" x="380" y="134" text-anchor="middle">AppReadService.resourceRoles(userId)</text>

  <path class="flow" d="M380,150 L380,196"/>
  <text class="side" x="390" y="168">expand each grant down its containment subtree</text>
  <text class="cite" x="390" y="183">api_registry.dart appResourceRoles</text>

  <rect class="box wire" x="120" y="196" width="520" height="42" rx="7"/>
  <text class="mono" x="380" y="222" text-anchor="middle">GET /resource-roles → Map&lt;String,String&gt; (resourceKey → roleName)</text>

  <path class="flow" d="M380,238 L380,284"/>
  <text class="side" x="390" y="256">fetched once at login — no per-field grade on the wire</text>
  <text class="cite" x="390" y="271">app_api_client.dart resourceRoles()</text>

  <rect class="box client" x="120" y="284" width="520" height="42" rx="7"/>
  <text class="mono" x="380" y="310" text-anchor="middle">AppSession installs AppResourceRoleAdapter → TomResourceRoleRegistry</text>

  <path class="flow" d="M380,326 L380,372"/>
  <text class="side" x="390" y="344">resolve the item ceiling: ResourceRoleKeys.item(id)</text>
  <text class="cite" x="390" y="359">item_detail_screen.dart _resolveForm()</text>

  <rect class="box client" x="120" y="372" width="520" height="42" rx="7"/>
  <text class="mono" x="380" y="398" text-anchor="middle">field.authorizer = fixed(resourceState.narrow(fieldGrade ?? none))</text>

  <path class="flow" d="M380,414 L380,460"/>
  <text class="side" x="390" y="432">authorizer.effectiveAuth(state) at layer 4</text>
  <text class="cite" x="390" y="447">tom_form.dart resolveEffectiveAuth()</text>

  <rect class="box client" x="120" y="460" width="520" height="42" rx="7"/>
  <text class="mono" x="380" y="486" text-anchor="middle">TomField.resolveEffectiveAuth() layer 4</text>

  <path class="flow" d="M380,502 L380,548"/>
  <text class="side" x="390" y="528">the per-field grade wins over the permissive layer-1 default</text>

  <rect class="box render" x="120" y="548" width="520" height="42" rx="7"/>
  <text class="lbl" x="380" y="574" text-anchor="middle" font-weight="600">TomAuthState → the field renders at its grade</text>

  <!-- Step 5 is where the two key spaces meet; drawing them merged is the
       recurring error this legend exists to prevent. -->
  <text class="side" x="120" y="616" font-weight="600">Two key spaces meet at step 5 — they are not one namespace:</text>
  <text class="mono" x="120" y="636">item:&lt;id&gt;</text>
  <text class="side" x="248" y="636">the resource — picks the role (resourceRoles[itemKey])</text>
  <text class="mono" x="120" y="652">todo.item.&lt;field&gt;</text>
  <text class="side" x="248" y="652">the graded field — picks the grade (grades[basePath])</text>
</svg>

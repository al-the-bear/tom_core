<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">
  <!--
    The grant rows -> resource-role map -> per-field grade -> field data path:
    the grade a field renders at, traced from a database row to a widget (RCC2).
      1. auth_db.tom_resource_grant rows (role_name, resource_key, access_level)
         plus the principal's share delegations
      2. AppReadService.resourceRoles(userId): fold ownership grants + shares and
         expand each down its containment subtree -> flat resourceKey -> roleName map
      3. GET /resource-roles -> Map<String,String>  (resourceKey -> roleName)
         (the app client fetches this ONCE at login; per-field grades never cross
          the wire on a read anymore)
      4. AppSession installs AppResourceRoleAdapter(resourceRoles) as the global
         TomAuthorization adapter -> TomResourceRoleRegistry  [app_session.dart,
         app_resource_role_adapter.dart]
      5. item screen resolves the item's resource ceiling through the registry and
         narrows it by the shared per-role field grade:
         itemKey = ResourceRoleKeys.item(id)   // shared-domain builder
         resourceState = TomAuthorization.resolveAuth(itemKey)
         field.authorizer = TomAuthorizer.fixed(
             resourceState.narrow(projectRoleFieldGrades[role][basePath] ?? none))
         [item_detail_screen.dart:146-171]
      6. TomField.resolveEffectiveAuth() layer 4  [tom_form.dart:823]
         (authorizer.effectiveAuth(state))
      7. TomAuthState -> the field renders at its grade.
    The server re-resolves the same grade on WRITE (FieldGradeResolver in
    AppWriteService) and rejects a changed field graded below full -- the client
    grade is a UX convenience, the server write-check is the guarantee.
  -->
  <defs>
    <marker id="arrow9" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#37474f"/>
    </marker>
  </defs>
  <style>
    .box{stroke:#37474f;stroke-width:1.5;}
    .db{fill:#eceff1;}
    .server{fill:#e8f5e9;}
    .wire{fill:#fff3e0;}
    .client{fill:#e3f2fd;}
    .render{fill:#f3e5f5;}
    .lbl{fill:#212121;}
    .mono{fill:#37474f;font-family:monospace;font-size:11px;}
    .flow{stroke:#37474f;stroke-width:1.5;fill:none;marker-end:url(#arrow9);}
    .cite{fill:#90a4ae;font-size:10.5px;font-family:monospace;}
    .side{fill:#546e7a;font-size:10.5px;}
  </style>

  <rect class="box db" x="120" y="20" width="520" height="42" rx="7"/>
  <text class="mono" x="380" y="46" text-anchor="middle">auth_db.tom_resource_grant rows + the principal's share delegations</text>

  <path class="flow" d="M380,62 L380,92"/>
  <text class="side" x="390" y="82">fold ownership grants + shares into effective roles</text>
  <text class="cite" x="630" y="82" text-anchor="end">resource_role_resolver.dart</text>

  <rect class="box server" x="120" y="92" width="520" height="42" rx="7"/>
  <text class="mono" x="380" y="118" text-anchor="middle">AppReadService.resourceRoles(userId)</text>

  <path class="flow" d="M380,134 L380,164"/>
  <text class="side" x="390" y="154">expand each grant down its containment subtree</text>
  <text class="cite" x="630" y="154" text-anchor="end">appResourceRoles</text>

  <rect class="box wire" x="120" y="164" width="520" height="42" rx="7"/>
  <text class="mono" x="380" y="190" text-anchor="middle">GET /resource-roles → Map&lt;String,String&gt; (resourceKey → roleName)</text>

  <path class="flow" d="M380,206 L380,236"/>
  <text class="side" x="390" y="226">fetched once at login — no per-field grade on the wire</text>
  <text class="cite" x="630" y="226" text-anchor="end">app_api_client.dart:247</text>

  <rect class="box client" x="120" y="236" width="520" height="42" rx="7"/>
  <text class="mono" x="380" y="262" text-anchor="middle">AppSession installs AppResourceRoleAdapter → TomResourceRoleRegistry</text>

  <path class="flow" d="M380,278 L380,308"/>
  <text class="side" x="390" y="298">resolve the item ceiling: ResourceRoleKeys.item(id)</text>
  <text class="cite" x="630" y="298" text-anchor="end">item_detail_screen.dart:146-171</text>

  <rect class="box client" x="120" y="308" width="520" height="42" rx="7"/>
  <text class="mono" x="380" y="334" text-anchor="middle">field.authorizer = fixed(resourceState.narrow(fieldGrade ?? none))</text>

  <path class="flow" d="M380,350 L380,380"/>
  <text class="side" x="390" y="370">authorizer.effectiveAuth(state) at layer 4</text>
  <text class="cite" x="630" y="370" text-anchor="end">tom_form.dart:823</text>

  <rect class="box client" x="120" y="380" width="520" height="42" rx="7"/>
  <text class="mono" x="380" y="406" text-anchor="middle">TomField.resolveEffectiveAuth() layer 4</text>

  <path class="flow" d="M380,422 L380,452"/>
  <text class="side" x="390" y="442">the per-field grade wins over the permissive layer-1 default</text>

  <rect class="box render" x="120" y="452" width="520" height="42" rx="7"/>
  <text class="lbl" x="380" y="478" text-anchor="middle" font-weight="600">TomAuthState → the field renders at its grade</text>
</svg>

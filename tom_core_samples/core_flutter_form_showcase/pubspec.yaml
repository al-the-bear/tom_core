name: core_flutter_form_showcase
description: >-
  Tom Core sample — a code-beside-form showcase of the tom_flutter_ui forms
  framework. Every cell renders a live, bound TomForm field next to a curated
  snippet of the Dart that declared it, grouped by forms feature (field types,
  validation, layout, theming, master-detail, lists, authorization, responsive).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # The Tom Flutter UI forms framework this sample showcases, plus the kernel it
  # builds on (observable state, reflection, the four-state authorization model).
  tom_flutter_ui:
    path: ../../tom_flutter_ui
  tom_core_kernel:
    path: ../../tom_core_kernel

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Reflection codegen — forms bind reflected @tomReflector entities, so this
  # sample (unlike core_flutter_ui_showcase) carries a build_runner step that
  # emits lib/reflection_seed.reflection.dart. Regenerate via
  # ./reflection_generation.sh only when reflected entity signatures change.
  build: ^4.0.3
  build_runner: ^2.10.4
  tom_reflection_generator:
    path: ../../../reflection/tom_reflection_generator

flutter:
  uses-material-design: true

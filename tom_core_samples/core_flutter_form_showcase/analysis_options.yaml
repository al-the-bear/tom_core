# Mirrors core_flutter_ui_showcase / tom_flutter_form_test: the recommended
# Flutter lint set. The generated reflection file is excluded — it is machine
# output and must not be linted.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # hides: 0 errors (measured 2026-09-18) — one generated reflection seed,
    #   rewritten by the reflection generator on every build. The entry keeps a
    #   machine-written file out of the LINT surface; nothing hand-written is
    #   behind it.
    - lib/reflection_seed.reflection.dart

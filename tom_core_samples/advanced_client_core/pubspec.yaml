name: advanced_client_core
description: >-
  Flutter-free dart:io client core for the advanced Tom Core full-stack sample —
  the authenticated HTTP layer (AuthClient login/refresh/logout, AuthorizedHttp
  bearer injection + refresh-on-401, and the AppApiClient / AdminApiClient typed
  parsers) shared by both Flutter clients.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  tom_core_kernel:
    path: ../../tom_core_kernel
  advanced_todo_contracts:
    path: ../advanced_todo_contracts
  # The reflected domain entities (Workspace/Project/TodoList/TodoItem/
  # TodoComment) the app-API parsers build from the wire JSON, plus
  # initializeReflection(). The contracts package already pulls it transitively
  # (its service interfaces are typed in these entities); declaring it directly
  # lets the client name the types without an implicit-dependency lint.
  advanced_todo_domain:
    path: ../advanced_todo_domain
  # The `Client` the file-transfer seam hands the kernel's transfer client
  # (src/http/file_transfer.dart). Transitive through tom_core_kernel, but named
  # here because this package's own source imports it.
  http: ^1.6.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
  build_runner: ^2.10.4
  # Generates lib/reflection_seed.reflection.dart (the combined domain+contracts
  # seed the client-core tests install via reflection_seed.dart).
  tom_reflection_generator:
    path: ../../../reflection/tom_reflection_generator

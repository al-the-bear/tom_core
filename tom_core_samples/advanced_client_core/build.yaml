# Reflection generator config. Seed the generator from one entry point
# (lib/reflection_seed.dart) so the reflected graph covers both families the
# client-core parsers round-trip: the shared advanced_todo_domain entities and
# the reflection-first advanced_todo_contracts DTOs. Emits
# lib/reflection_seed.reflection.dart (used only by the client-core tests).
targets:
  $default:
    builders:
      tom_reflection_generator:reflection_generator:
        generate_for:
          - lib/reflection_seed.dart
        options:
          formatted: true

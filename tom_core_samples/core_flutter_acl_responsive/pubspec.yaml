name: core_flutter_acl_responsive
description: >-
  Tom Core sample — responsive UIs built with the ACL/forms engine. Every cell
  pairs a live, width-reactive layout with a curated snippet of the Dart that
  declares it, grouped by responsive mechanism (breakpoint field style, family swap, row
  breakpoints, form-factor variants, adaptive sizing, responsive ACL forms).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # The Tom Flutter UI engine this sample showcases (ACL layout, breakpoints,
  # form-field families, TomFormStyleScope width publishing), plus the kernel it
  # builds on (observable state, reflection).
  tom_flutter_ui:
    path: ../../tom_flutter_ui
  tom_core_kernel:
    path: ../../tom_core_kernel

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Reflection codegen — the family-swap and breakpoint screens bind reflected
  # @tomReflector entities into TomForm<T>, so this sample (like
  # core_flutter_form_showcase) carries a build_runner step that emits
  # lib/reflection_seed.reflection.dart. Regenerate via ./reflection_generation.sh
  # only when reflected entity signatures change.
  build: ^4.0.3
  build_runner: ^2.10.4
  # Hosted, lower bound only: pub takes the analyzer-10 line (1.8.x) while
  # flutter or tom_d4rt hold analyzer below 14, and 1.9+ once they move.
  tom_reflection_generator: ">=1.8.2"

flutter:
  uses-material-design: true

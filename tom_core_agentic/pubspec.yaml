name: tom_core_agentic
description: >-
  Generic building blocks for agentic systems in the TOM framework:
  cooperative cancellation, lifecycle close-guards, dedup-by-id, text
  previews, HTTP-date parsing, typed YAML config reading, the sha256
  content-hash convention, the LLM provider contract with the Anthropic
  Agent SDK provider, and the editor-facing agent data models (profiles,
  prompt queue, chat/trail, reminders, timed requests). Domain-neutral,
  depends only on tom_basics and tom_vscode_scripting_api (for the Agent
  SDK bridge).
version: 1.8.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  tom_basics: any
  tom_vscode_scripting_api: ^1.1.0
  yaml: ^3.1.0
  yaml_edit: ^2.2.4
  crypto: ^3.0.0
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0

name: tom_core_agentic
description: >-
  Generic building blocks for agentic systems in the TOM framework:
  cooperative cancellation, lifecycle close-guards, dedup-by-id, text
  previews, HTTP-date parsing, and typed YAML config reading. No
  domain dependencies beyond tom_basics.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  tom_basics: any
  yaml: ^3.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0

targets:
  $default:
    builders:
      tom_reflection_generator:reflection_generator:
        generate_for:
          # The reflection root for the d4rt tool's persistence demo. The
          # generator follows its import graph to capture the demo entity
          # (D4rtDemoTaskRecord) and, transitively via the tom_core_server
          # barrel, the reflected server surface. Emits
          # lib/src/demo_persistence/reflection_root.reflection.dart, whose
          # initializeReflection() the d4rt tool calls once at boot (d4rtMain) so
          # scripts can reflectType() reflected types inside the AOT binary.
          - lib/src/demo_persistence/reflection_root.dart
        options:
          formatted: true

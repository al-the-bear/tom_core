name: tom_core_d4rt
description: D4rt tool with full Tom Framework bridge support.
version: 1.0.13
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  # D4rt runtime
  # >=1.12.0 carries the RCC7 enum-bridging fix (Map<String,Enum> value
  # coercion + native-stored enum round-trip) the replays rely on.
  tom_d4rt: ">=1.12.0"
  
  # D4rt base REPL with dcli bridges
  # >=1.1.6 carries the duplicate-export fix required for AOT compilation.
  tom_d4rt_dcli: ">=1.1.6"
  
  # Projects to bridge
  tom_core_kernel:
    path: ../tom_core_kernel
  tom_core_server:
    path: ../tom_core_server
  tom_build:
    path: ../../devops/tom_build
  tom_dist_ledger:
    path: ../../distributed/tom_dist_ledger
  tom_process_monitor:
    path: ../../distributed/tom_process_monitor
  tom_doc_scanner:
    path: ../../ai_build/tom_doc_scanner
  tom_doc_specs:
    path: ../../ai_build/tom_doc_specs
  tom_md2latex:
    path: ../../devops/tom_md2latex
  tom_md2pdf:
    path: ../../devops/tom_md2pdf
  tom_basics_network: ">=1.0.1"
  # >=1.0.1 carries the RCE6 TomLogger push/pop LIFO fix that the tom_basics
  # replay's post-pop restore assertion depends on.
  tom_basics: ">=1.0.1"

  # External packages
  dcli: ^8.4.2
  dcli_core: ^8.2.8
  dart_console: ^4.1.2
  console_markdown: ^0.0.3

dev_dependencies:
  build_runner: ^2.4.15
  lints: ^6.0.0
  test: ^1.25.6
  # >=1.9.5 carries the B3b (explicit method type args) + B4 (part-of via
  # package_config) AOT bridge-compile fixes for this project's corpus.
  tom_d4rt_generator: ">=1.12.1"

name: tom_core_settings
description: >-
  Settings and secrets for Tom applications: a key port for encrypted
  containers, a platform secret-store port, the device settings file and the
  bootstrap that mints its settings key, the user's identity, and registered
  storage locations with forgetting one. Platform-neutral.
version: 0.1.0
publish_to: none
repository: https://github.com/al-the-bear/tom_ai_core

environment:
  sdk: ^3.10.0

dependencies:
  meta: ^1.15.0
  # The diagnostics level, the YAML emitter and reader.
  tom_basics:
    path: ../../basics/tom_basics
  # The storage port the device file is read and committed through, the cache
  # and journal a forgotten location is scrubbed from.
  tom_core_storage:
    path: ../tom_core_storage
  # The handle a minted settings key is stored under.
  uuid: ^4.0.0
  yaml: ^3.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  # The in-memory GitHub, for forgetting a location on the GitHub backend.
  tom_github_api:
    path: ../../devops/tom_github_api
  http: ^1.2.0

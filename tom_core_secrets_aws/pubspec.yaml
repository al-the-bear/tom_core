name: tom_core_secrets_aws
description: AWS Secrets Manager as a secrets provider for Tom servers — configuration values written as secret:aws:<secret-id>#<field> references, resolved and refreshed through the Secrets Manager API with SigV4.
version: 0.1.0
publish_to: none

repository: https://github.com/al-the-bear/tom_core
homepage: https://github.com/al-the-bear/tom_core/tree/main/tom_core_secrets_aws

environment:
  sdk: ^3.10.0

dependencies:
  crypto: ^3.0.0
  http: ^1.6.0
  tom_core_kernel:
    path: ../tom_core_kernel
  tom_core_server:
    path: ../tom_core_server

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

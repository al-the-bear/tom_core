name: tom_core_agent_sdk
description: >-
  Anthropic's Claude Agent SDK as an LLM provider for Tom applications: one
  transport seam with two implementations — a running VS Code CLI server and a
  standalone Node server the app starts and owns — the SDK's messages
  translated into tom_llm run events, a liveness bound, sessions each in
  an isolate of its own, an availability gate with its reason, and an
  on-demand install of the server's npm dependencies.
version: 0.1.0
publish_to: none
repository: https://github.com/al-the-bear/tom_ai_core

environment:
  sdk: ^3.10.8

dependencies:
  meta: ^1.15.0
  # The structured diagnostics port the session manager logs through.
  tom_basics: ">=3.3.0"
  # The provider contract this package implements and the run events it
  # streams.
  tom_llm:
    path: ../../basics/tom_llm
  # The CLI-server wire, its 19900–19909 discovery scan, and the Agent SDK
  # message mirror.
  tom_vscode_scripting_api:
    path: ../../vscode/tom_vscode_scripting_api

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

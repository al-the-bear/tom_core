name: tom_core_storage
description: >-
  Storage for Tom applications: a compare-and-swap storage port, keyed file
  media, a device-local cache, a durable offline commit journal, and the local
  filesystem, browser (IndexedDB) and cache-cipher implementations behind
  entry points of their own, and a GitHub repository or any git server over
  smart HTTP as a backend.
version: 0.1.1
repository: https://github.com/al-the-bear/tom_core

environment:
  sdk: ^3.10.0

dependencies:
  # ZIP: a bundle medium reads and writes its container as one archive.
  archive: ^4.0.0
  meta: ^1.15.0
  # Joining paths on the local filesystem (io.dart).
  path: ^1.9.0
  # AES-256-GCM for the optional cache cipher (cipher.dart).
  pointycastle: ^4.0.0
  # The structured diagnostics port, the YAML emitter and the content hash.
  tom_basics: ^3.3.0
  # The HTTP client the git backend's transport is given (git.dart).
  http: ^1.2.0
  # Git in pure Dart, for the git backend (git.dart): no git binary needed.
  tom_git:
    path: ../../basics/tom_git
  # The GitHub REST and git-data API, for the GitHub backend (github.dart).
  tom_github_api:
    path: ../../basics/tom_github_api
  # IndexedDB, for the browser medium (web.dart).
  web: ^1.1.0
  # Reading the commit journal's entries back.
  yaml: ^3.1.0
  # The device id the settings bootstrap mints (settings.dart).
  uuid: ^4.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  # The live contract and the Gitea fixture, for the gated live suites.
  tom_test_support:
    path: ../../basics/tom_test_support
